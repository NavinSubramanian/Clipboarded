<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipBoarded</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          🔒 ClipBoarded
          <button id="openSettings" class="btn btn-settings" title="Settings">
            <i class="fa-solid fa-gears"></i>
          </button>
          <!-- <button id="themeToggle" class="btn btn-theme" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button> -->
        </h1>
        <div class="search-container">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search fields..."
          />
        </div>
      </header>

      <div id="tagFilterBar" class="tag-filter-bar"></div>

      <div id="fieldsContainer"></div>

      <div class="actions">
        <button id="addField" class="btn btn-add">
          <span class="btn-icon">+</span>
          <span class="btn-text">Field</span>
        </button>
        <button id="export" class="btn btn-secondary">
          <span class="btn-icon"><i class="fa-solid fa-download"></i></span>
          <span class="btn-text">Export</span>
        </button>
        <button id="import" class="btn btn-secondary">
          <span class="btn-icon"><i class="fa-solid fa-upload"></i></span>
          <span class="btn-text">Import</span>
        </button>
        <input
          type="file"
          id="importFile"
          accept=".json"
          style="display: none"
        />
      </div>

      <div id="notification" class="notification">
        <span id="notificationText"></span>
      </div>

      <footer class="footer">
        <span>
          <a
            href="https://nnavin.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            >Navin Subramanian</a
          ></span
        >
      </footer>
    </div>

    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <h2>Settings</h2>
        <div class="input-group">
          <label>Current Password</label>
          <input
            type="password"
            id="currentPasswordInput"
            placeholder="Enter current password"
          />
        </div>

        <div class="input-group">
          <label>New Password</label>
          <input
            type="password"
            id="newPasswordInput"
            placeholder="Enter new password"
          />
        </div>

        <div class="modal-actions">
          <button id="savePassword" class="btn btn-save">Save</button>
          <button id="cancelSettings" class="btn btn-cancel">Cancel</button>
        </div>

        <div class="danger-zone">
          <hr />
          <button id="wipeProtected" class="btn btn-delete">
            Forgot Password? Wipe Protected Fields
          </button>
        </div>
      </div>
    </div>

    <div id="confirmationModal" class="modal">
      <div class="modal-content">
        <h2>Confirm Deletion</h2>
        <p>Are you sure you want to delete this field?</p>
        <div class="modal-actions">
          <button id="cancelDelete" class="btn btn-cancel">Cancel</button>
          <button id="confirmDelete" class="btn btn-delete">Delete</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
